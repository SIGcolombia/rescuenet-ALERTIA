<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14202B">
<title>Prioriza móvil</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="showcase" id="showcase">
  <h1>PRIORIZA <span>· MÓVIL</span></h1>
  <div class="showcase-tools">
    <div class="seg" role="group" aria-label="Vista de la demostración">
      <button type="button" data-action="view" data-view="gallery" aria-pressed="true">Galería</button>
      <button type="button" data-action="view" data-view="app" aria-pressed="false">App</button>
    </div>
    <button type="button" class="icon-btn" data-action="theme" data-theme-btn aria-label="Cambiar entre tema claro y oscuro"></button>
  </div>
</header>

<main id="stage" class="stage"></main>

<footer class="showcase-foot" id="showcase-foot">
  Datos de demostración. Funciona sin internet y sin librerías externas. Prioriza recomienda, la decisión es del coordinador.
</footer>

<noscript><p style="padding:24px">Esta demostración necesita JavaScript activado.</p></noscript>
<script src="app.js"></script>
</body>
</html>
